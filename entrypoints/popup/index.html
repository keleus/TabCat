<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>添加到 TabCat</title>
    <link rel="icon" type="image/svg+xml" href="/icon/tabcat.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header><img class="brand-mark" src="/icon/tabcat.svg" width="29" height="29" alt="" /><strong>TabCat</strong><span class="tag">快捷收藏</span></header>
    <main>
      <h1>添加快捷方式</h1>
      <p class="subtitle">将当前网页固定在新标签页。</p>
      <form id="pinForm">
        <label for="siteName">网站名称</label>
        <input id="siteName" maxlength="80" required autocomplete="off" disabled />
        <label for="siteUrl">网页地址</label>
        <input id="siteUrl" type="url" required autocomplete="off" disabled />
        <p id="status" role="status" aria-live="polite">正在读取当前网页…</p>
        <button id="pinButton" type="submit" disabled>添加到首页</button>
      </form>
      <button id="openHome" class="secondary" type="button">打开 TabCat 首页 <span></span></button>
    </main>
    <footer>你的快捷方式，仅保存在此浏览器。</footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
