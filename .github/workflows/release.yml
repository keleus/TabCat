name: Release

# 由 `pnpm release` 推送的 v* 标签触发：测试、打包，并创建附带 ZIP 的 GitHub Release。
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Check tag matches package.json
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm zip

      - uses: actions/upload-artifact@v4
        with:
          name: tabcat-chrome
          path: output/tabcat-${{ steps.version.outputs.version }}-chrome.zip
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tabcat-chrome

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP: tabcat-${{ needs.build.outputs.version }}-chrome.zip
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
